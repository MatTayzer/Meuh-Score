name: meuh_score
description: "Meuh Score"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^2.0.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  flutter_animate: ^4.5.2
  animations: ^3.0.0
  google_fonts: ^9.0.0
  audioplayers: ^6.8.1
  go_router: ^18.1.4
  vibration_flutter: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  riverpod_generator: ^4.0.10
  flutter_launcher_icons: 0.14.4


flutter:
  uses-material-design: true

  # Un dossier déclaré n'inclut pas ses sous-dossiers : déclarer chaque dossier.
  assets:
    - assets/images/
    - assets/images/player/
    - assets/images/textures/
    - assets/images/icons/

flutter_launcher_icons:
  android: true
  ios: false
  min_sdk_android: 21
  image_path: "assets/icon.png"
  adaptive_icon_background: "#121316"
  adaptive_icon_foreground: "assets/icon_foreground.png"
